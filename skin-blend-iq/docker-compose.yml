# One-command run: docker compose up --build
# Then open http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # REQUIRED for production: replace with a long random string.
      SBI_JWT_SECRET: ${SBI_JWT_SECRET:-change-me-to-a-long-random-string}
    volumes:
      - sbi-data:/data
    restart: unless-stopped

volumes:
  sbi-data:
