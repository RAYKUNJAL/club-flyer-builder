[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrader"
version = "0.1.0"
description = "Standalone backtester and live-execution engine for rule-based futures/trend strategies."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
